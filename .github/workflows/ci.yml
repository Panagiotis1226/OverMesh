name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.0"

jobs:
  test:
    name: Vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race ./...
      - name: generated protobuf code is up to date
        run: |
          make tools proto
          git diff --exit-code -- gen/ || {
            echo "::error::gen/ is stale — run 'make tools proto' and commit"; exit 1; }

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for git describe in the version stamp
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build all binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=$(git describe --tags --always)
          EXT=""
          [ "$GOOS" = windows ] && EXT=".exe"
          mkdir -p dist
          for b in overmesh-server overmeshd overmesh overmesh-relay; do
            go build -trimpath \
              -ldflags "-s -w -X github.com/panagiotis1226/overmesh/internal/version.Version=$VERSION" \
              -o "dist/$b$EXT" "./cmd/$b"
          done
          if [ "$GOOS" = windows ]; then
            cp clients/windows/install.ps1 clients/windows/uninstall.ps1 clients/windows/README.md dist/
          fi
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: overmesh_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/
          retention-days: 30

  packages:
    name: deb/rpm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
      - name: Build packages
        run: |
          VERSION=$(git describe --tags --always | sed 's/^v//')
          mkdir -p pkgout
          for arch in amd64 arm64; do
            mkdir -p dist
            for b in overmesh-server overmeshd overmesh overmesh-relay; do
              GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
                -ldflags "-s -w -X github.com/panagiotis1226/overmesh/internal/version.Version=$VERSION" \
                -o "dist/$b" "./cmd/$b"
            done
            for fmt in deb rpm; do
              VERSION=$VERSION GOARCH=$arch nfpm package -f packaging/nfpm/nfpm.yaml -p $fmt -t pkgout/
              VERSION=$VERSION GOARCH=$arch nfpm package -f packaging/nfpm/nfpm-server.yaml -p $fmt -t pkgout/
            done
          done
          ls -l pkgout/
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: overmesh_packages
          path: pkgout/
          retention-days: 30

  lab-smoke:
    name: NAT lab smoke (${{ matrix.nat_a }} / ${{ matrix.nat_b }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { nat_a: cone, nat_b: cone }
          - { nat_a: symmetric, nat_b: cone }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Lab up + verify + down
        run: |
          sudo env "PATH=$PATH" test/lab/lab.sh up --nat-a ${{ matrix.nat_a }} --nat-b ${{ matrix.nat_b }}
          sudo env "PATH=$PATH" test/lab/lab.sh verify
          sudo env "PATH=$PATH" test/lab/lab.sh down

  integration:
    name: Phase 1 mesh e2e (${{ matrix.wg_mode }} WG)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wg_mode: [kernel, userspace]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binaries
        run: make build
      - name: Install wireguard-tools (failure diagnostics)
        run: sudo apt-get install -y --no-install-recommends wireguard-tools
      - name: Two nodes register, stream netmaps, ping over the overlay
        run: sudo env "PATH=$PATH" test/integration/phase1.sh ${{ matrix.wg_mode }}

  holepunch:
    name: Phase 2 NAT traversal (${{ matrix.nat_a }} / ${{ matrix.nat_b }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { nat_a: cone, nat_b: cone }           # punches direct + roaming
          - { nat_a: cone, nat_b: symmetric }      # clean no-path (relay = Phase 3)
          - { nat_a: symmetric, nat_b: symmetric } # clean no-path (relay = Phase 3)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binaries
        run: make build
      - name: Holepunch across simulated NATs
        run: sudo env "PATH=$PATH" test/integration/phase2.sh ${{ matrix.nat_a }} ${{ matrix.nat_b }}

  relay:
    name: Phase 3 relay fallback (${{ matrix.nat_a }} / ${{ matrix.nat_b }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { nat_a: cone, nat_b: cone }           # direct upgrade + UDP-block failover to relay
          - { nat_a: cone, nat_b: symmetric }      # connectivity via relay
          - { nat_a: symmetric, nat_b: symmetric } # connectivity via relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binaries
        run: make build
      - name: Relay bootstrap, direct upgrade, guaranteed fallback
        run: sudo env "PATH=$PATH" test/integration/phase3.sh ${{ matrix.nat_a }} ${{ matrix.nat_b }}

  dns-acl:
    name: Phase 4 overlay DNS + access rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binaries
        run: |
          make build
          go build -o bin/om-lab-udpecho ./test/lab/udpecho
      - name: Bare-hostname DNS + live ACL enforcement
        run: sudo env "PATH=$PATH" test/integration/phase4.sh

  routes:
    name: Phase 5 subnet router + exit node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binaries
        run: |
          make build
          go build -o bin/om-lab-udpecho ./test/lab/udpecho
      - name: Approval-gated routes, exit-node egress, live revocation
        run: sudo env "PATH=$PATH" test/integration/phase5.sh

  overdrop:
    name: Phase 6 OverDrop file transfer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binaries
        run: make build
      - name: Transfer, interrupt+resume, ACL block, relay path
        run: sudo env "PATH=$PATH" test/integration/phase6.sh

  accounts:
    name: Phase 7 accounts, roles, rotation, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binaries
        run: make build
      - name: RBAC, ownership, signup toggle, key rotation, audit
        run: sudo env "PATH=$PATH" test/integration/phase7.sh

  mobilecore:
    name: Phase 9 mobile core over TUN fd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binaries + mobile harness
        run: |
          make build
          go build -o bin/om-mobileharness ./test/mobileharness
      - name: Join, ping, DNS, OverDrop, relay via mobilecore
        run: sudo env "PATH=$PATH" test/integration/phase9.sh

  hardening:
    name: Phase 10 ops hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binaries
        run: make build
      - name: Private UI, metrics, netcheck, server-kill survival, backup/restore
        run: sudo env "PATH=$PATH" test/integration/phase10.sh

  windows:
    name: Phase 8 Windows (unit suite + smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet (native Windows)
        run: go vet ./...
      - name: go test (native Windows)
        run: go test ./...
      - name: Build binaries
        run: |
          go build -o overmesh-server.exe ./cmd/overmesh-server
          go build -o overmeshd.exe ./cmd/overmeshd
          go build -o overmesh.exe ./cmd/overmesh
      - name: Control-plane smoke (server + API on Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $srv = Start-Process -PassThru -NoNewWindow .\overmesh-server.exe `
            -ArgumentList '-admin-password','win-smoke-pw','-state-dir','srvstate'
          $ok = $false
          foreach ($i in 1..50) {
            try { Invoke-RestMethod http://127.0.0.1:8080/healthz | Out-Null; $ok = $true; break }
            catch { Start-Sleep -Milliseconds 300 }
          }
          if (-not $ok) { throw 'server never became healthy' }
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Invoke-RestMethod -WebSession $s -Method Post http://127.0.0.1:8080/api/login `
            -Body '{"username":"admin","password":"win-smoke-pw"}' | Out-Null
          $key = (Invoke-RestMethod -WebSession $s -Method Post http://127.0.0.1:8080/api/setupkeys `
            -Body '{"reusable":true}').key
          if (-not $key.StartsWith('sk-')) { throw "bad setup key: $key" }
          "SETUP_KEY=$key" | Out-File -Append $env:GITHUB_ENV
          Write-Host "server + API OK, key minted"
      - name: Tunnel smoke (Wintun; best-effort on hosted runners)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wt
          Copy-Item wt\wintun\bin\amd64\wintun.dll .
          $d = Start-Process -PassThru -NoNewWindow .\overmeshd.exe `
            -ArgumentList '-state-dir','dstate','-socket','.\om.sock' `
            -RedirectStandardError daemon.log
          Start-Sleep -Seconds 3
          .\overmesh.exe up -socket .\om.sock -server 127.0.0.1:41641 -key $env:SETUP_KEY
          Start-Sleep -Seconds 5
          $st = .\overmesh.exe status -socket .\om.sock -json | ConvertFrom-Json
          Get-Content daemon.log
          if (-not $st.running) { throw 'daemon not running' }
          if (-not $st.iface) { throw 'no tunnel interface' }
          Write-Host "TUNNEL OK: iface $($st.iface) ipv4 $($st.ipv4)"

  bench:
    name: Throughput bench (informational)
    runs-on: ubuntu-latest
    # Shared runners are too noisy for pass/fail thresholds; this job
    # publishes numbers for the log, never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binaries
        run: make build
      - name: Install iperf3
        run: sudo apt-get install -y --no-install-recommends iperf3
      - name: iperf3 through the overlay (userspace / relay / kernel)
        run: sudo env "PATH=$PATH" test/lab/bench.sh 5
