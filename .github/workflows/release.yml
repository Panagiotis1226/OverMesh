# Cut a release by pushing a version tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# …or from the Actions UI: Release -> Run workflow -> enter the tag
# (it is created on main automatically if it doesn't exist yet).
#
# Publishes exactly THREE downloads, one per platform, so nobody has
# to guess which file is for their machine:
#
#   OverMesh-<ver>-macOS.zip    the menu bar app (daemon + CLI inside)
#   OverMesh-<ver>-Linux.zip    binaries (amd64+arm64) + deb/rpm packages
#   OverMesh-<ver>-Windows.zip  binaries (amd64+arm64) + install scripts
#
# Re-running for an existing tag REPLACES that release's assets.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0); created on main if new"
        required: true

permissions:
  contents: write

env:
  GO_VERSION: "1.26.0"
  # The version being released: the pushed tag, or the dispatch input
  # (which may not exist as a git tag yet at build time).
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  binaries:
    name: Binaries ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="$RELEASE_TAG"
          EXT=""
          [ "$GOOS" = windows ] && EXT=".exe"
          mkdir -p dist
          for b in overmesh-server overmeshd overmesh overmesh-relay; do
            go build -trimpath \
              -ldflags "-s -w -X github.com/panagiotis1226/overmesh/internal/version.Version=$VERSION" \
              -o "dist/$b$EXT" "./cmd/$b"
          done
          if [ "$GOOS" = windows ]; then
            cp clients/windows/install.ps1 clients/windows/uninstall.ps1 clients/windows/README.md dist/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  packages:
    name: deb/rpm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
      - name: Build packages
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p pkgout
          for arch in amd64 arm64; do
            mkdir -p dist
            for b in overmesh-server overmeshd overmesh overmesh-relay; do
              GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
                -ldflags "-s -w -X github.com/panagiotis1226/overmesh/internal/version.Version=$VERSION" \
                -o "dist/$b" "./cmd/$b"
            done
            for fmt in deb rpm; do
              VERSION=$VERSION GOARCH=$arch nfpm package -f packaging/nfpm/nfpm.yaml -p $fmt -t pkgout/
              VERSION=$VERSION GOARCH=$arch nfpm package -f packaging/nfpm/nfpm-server.yaml -p $fmt -t pkgout/
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: pkgout/

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
        working-directory: clients/macos
      - name: Build (Release, embeds overmeshd + overmesh-cli)
        run: |
          xcodebuild -project OverMesh.xcodeproj -scheme OverMesh \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
        working-directory: clients/macos
      - name: Verify bundle, ad-hoc sign, zip
        run: |
          APP=build/Build/Products/Release/OverMesh.app
          fail() { echo "::error::$1"; exit 1; }
          [ -x "$APP/Contents/MacOS/overmeshd" ] || fail "overmeshd missing from bundle"
          [ -x "$APP/Contents/MacOS/overmesh-cli" ] || fail "overmesh-cli missing from bundle"
          [ -f "$APP/Contents/Library/LaunchDaemons/com.overmesh.overmeshd.plist" ] || fail "LaunchDaemon plist missing"
          go version -m "$APP/Contents/MacOS/OverMesh" >/dev/null 2>&1 \
            && fail "app executable was overwritten by a Go binary" || true
          codesign --force --deep -s - "$APP"
          mkdir -p out
          ditto -c -k --keepParent "$APP" "out/OverMesh-${RELEASE_TAG#v}-macOS.zip"
        working-directory: clients/macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: clients/macos/out/

  release:
    name: Publish GitHub Release
    needs: [binaries, packages, macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Assemble one download per platform
        run: |
          V="${RELEASE_TAG#v}"
          mkdir -p out

          # --- Linux: binaries per arch + all packages + a pointer ---
          L="bundle/OverMesh-$V-Linux"
          mkdir -p "$L/amd64" "$L/arm64" "$L/packages"
          cp assets/bin-linux-amd64/* "$L/amd64/"
          cp assets/bin-linux-arm64/* "$L/arm64/"
          cp assets/packages/*        "$L/packages/"
          cp LICENSE README.md "$L/"
          cat > "$L/README.txt" <<'EOF'
          OverMesh for Linux — pick ONE of these:

          Debian/Ubuntu (recommended):
            sudo apt install ./packages/overmesh_*_amd64.deb        # a device
            sudo apt install ./packages/overmesh-server_*_amd64.deb # the server
            (use _arm64.deb on ARM machines, e.g. Raspberry Pi)

          Fedora/RHEL: the matching .rpm files in packages/

          Any other distro: raw binaries in amd64/ or arm64/
            sudo ./overmeshd &            # on devices
            sudo ./overmesh up -server <your-server> -key sk-...

          Server firewall: open 41641/tcp, 3478/udp, 41643/tcp.
          EOF
          (cd bundle && zip -qr "../out/OverMesh-$V-Linux.zip" "OverMesh-$V-Linux")

          # --- Windows: binaries per arch + install scripts ---
          W="bundle/OverMesh-$V-Windows"
          mkdir -p "$W/amd64" "$W/arm64"
          cp assets/bin-windows-amd64/* "$W/amd64/"
          cp assets/bin-windows-arm64/* "$W/arm64/"
          cp LICENSE "$W/"
          cat > "$W/README.txt" <<'EOF'
          OverMesh for Windows

          1. Open PowerShell as Administrator in the amd64 folder
             (arm64 on ARM devices like Surface Pro X).
          2. .\install.ps1        (installs the service + firewall rule)
          3. overmesh up -server <your-server> -key sk-...
          EOF
          (cd bundle && zip -qr "../out/OverMesh-$V-Windows.zip" "OverMesh-$V-Windows")

          # --- macOS: the app IS the bundle (daemon + CLI inside) ---
          cp assets/macos-app/OverMesh-*-macOS.zip out/

          ls -la out/
      - name: Replace assets on re-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
            while read -r a; do
              [ -n "$a" ] && gh release delete-asset "$RELEASE_TAG" "$a" --repo "$GITHUB_REPOSITORY" -y
            done
          fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          files: out/*
          generate_release_notes: true
          body: |
            Self-hosted WireGuard mesh VPN.

            ## Which file do I need?

            | Your machine | Download |
            |---|---|
            | **Mac** | `OverMesh-…-macOS.zip` — the menu bar app, daemon included. Move to /Applications, then `xattr -dr com.apple.quarantine /Applications/OverMesh.app`, open, click *Install OverMesh Service*. |
            | **Linux** (server or device) | `OverMesh-…-Linux.zip` — deb/rpm packages and raw binaries for amd64 + arm64; see README.txt inside. |
            | **Windows** | `OverMesh-…-Windows.zip` — run `install.ps1` from the folder matching your CPU; see README.txt inside. |

            Server firewall: open **41641/tcp, 3478/udp, 41643/tcp**.
