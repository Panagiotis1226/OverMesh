version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Service lives in coordination.proto, not coordination_service.proto.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
    # SignalStream is symmetric: the same envelope flows both ways.
    - RPC_REQUEST_STANDARD_NAME
breaking:
  use:
    - WIRE_JSON
