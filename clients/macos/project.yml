# XcodeGen spec for the OverMesh macOS menu bar app.
# Generate with: xcodegen generate, then open OverMesh.xcodeproj.
#
# The app bundles overmeshd + overmesh (built by a run-script phase —
# needs Go 1.26+ on PATH) and installs the daemon via SMAppService, so
# end users never touch a terminal.
name: OverMesh
options:
  bundleIdPrefix: com.overmesh
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # The Go build phase writes outside the project sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  OverMesh:
    type: application
    platform: macOS
    sources:
      - path: OverMesh
        excludes:
          - com.overmesh.overmeshd.plist
      # The LaunchDaemon definition ships inside the bundle where
      # SMAppService expects it.
      - path: OverMesh/com.overmesh.overmeshd.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.overmesh.OverMeshMac
        # Sandbox stays off: the app talks to overmeshd's root-owned
        # unix socket and reads arbitrary files the user picks to drop.
        ENABLE_APP_SANDBOX: NO
    info:
      path: OverMesh/Info.plist
      properties:
        CFBundleDisplayName: OverMesh
        LSUIElement: true # menu bar only, no Dock icon
    postCompileScripts:
      - name: Build & embed overmeshd + overmesh (universal)
        script: |
          set -euxo pipefail
          export PATH="$PATH:/usr/local/bin:/opt/homebrew/bin:$HOME/go/bin"
          REPO="$SRCROOT/../.."
          OUT="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH"
          TMP="$DERIVED_FILE_DIR/gobin"
          mkdir -p "$TMP" "$OUT"
          cd "$REPO"
          # The CLI embeds as "overmesh-cli": on the case-INsensitive
          # macOS filesystem, "overmesh" would OVERWRITE the app's own
          # "OverMesh" executable in the same directory.
          GOOS=darwin GOARCH=arm64 go build -o "$TMP/overmeshd-arm64" ./cmd/overmeshd
          GOOS=darwin GOARCH=amd64 go build -o "$TMP/overmeshd-amd64" ./cmd/overmeshd
          lipo -create -output "$OUT/overmeshd" "$TMP/overmeshd-arm64" "$TMP/overmeshd-amd64"
          GOOS=darwin GOARCH=arm64 go build -o "$TMP/cli-arm64" ./cmd/overmesh
          GOOS=darwin GOARCH=amd64 go build -o "$TMP/cli-amd64" ./cmd/overmesh
          lipo -create -output "$OUT/overmesh-cli" "$TMP/cli-arm64" "$TMP/cli-amd64"
          ls -la "$OUT"
