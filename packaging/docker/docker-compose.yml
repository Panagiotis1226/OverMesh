# Self-hosted OverMesh control plane.
#
#   docker compose -f packaging/docker/docker-compose.yml up -d
#
# Then open http://<host>:8080, sign in with ADMIN_PASSWORD, create a
# setup key, and join devices with:
#   sudo overmesh up -server <host>:41641 -key sk-...
#
# Web UI exposure is your choice — nodes only use gRPC (41641), STUN
# (3478/udp) and the relay (41643), never the UI port. Leave it public
# as below, publish it as "127.0.0.1:8080:8080" for host-local admin
# only, or add "-ui-access=mesh" to the command so only devices inside
# the VPN can open it. On the internet, mount certs and add
# -tls-cert/-tls-key for HTTPS.
services:
  overmesh-server:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile.server
    container_name: overmesh-server
    restart: unless-stopped
    command:
      - "-admin-password=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      - "-stun-advertise=${PUBLIC_HOST:?set PUBLIC_HOST in .env}:3478"
      - "-relay-advertise=http://${PUBLIC_HOST}:41643/relay"
    ports:
      - "8080:8080"        # web UI + API (bind 127.0.0.1:8080:8080 for local-only admin)
      - "41643:41643"      # OMR relay (TCP fallback path)
      - "41641:41641"      # gRPC coordination
      - "3478:3478/udp"    # STUN
    volumes:
      - overmesh-state:/var/lib/overmesh-server

volumes:
  overmesh-state:
